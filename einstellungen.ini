# ==================================================================
#  Titel und Kategorien für den Pinterest-Feed von deluminar.com
# ==================================================================
#
#  So änderst du etwas (direkt auf github.com):
#   1. Diese Datei öffnen und oben rechts auf den Stift (Edit) klicken.
#   2. Den Text hinter "titel =" oder "kategorie =" ändern.
#   3. Oben rechts auf "Commit changes" klicken und noch einmal bestätigen.
#      Der Feed wird danach automatisch neu gebaut (dauert ca. 1 Minute).
#
#  Regeln:
#   - Zeilen mit # am Anfang sind nur Hinweise. Sie werden ignoriert.
#   - Die Zeile in eckigen Klammern [ ... ] ist die Produkt-ID aus Wix.
#     Bitte nicht ändern, darüber wird das Produkt zugeordnet.
#     (Statt der Produkt-ID darf dort auch die ID einer einzelnen
#     Variante stehen, dann gilt der Block nur für diese Variante.)
#   - "name" dient nur zur Orientierung.
#   - Im "titel" wird ein Wort in geschweiften Klammern bei jeder Variante
#     durch den Wert aus Wix ersetzt, z. B. {Farbe} durch "Eiche Natur".
#     Welche es gibt, steht beim jeweiligen Produkt unter "Varianten im Feed".
#   - Titel möglichst nicht länger als 120 Zeichen.
#   - "kategorie" ist die Nummer aus der Google-Produkttaxonomie:
#       2524 = Deckenleuchten  (Home & Garden > Lighting > Lighting Fixtures > Ceiling Light Fixtures)
#       6073 = Wandleuchten    (Home & Garden > Lighting > Lighting Fixtures > Wall Light Fixtures)
#   - Nicht eingetragene Produkte bekommen den Wix-Titel. Du bekommst dann
#     auf GitHub ein Issue mit einem fertigen Block zum Hineinkopieren.

